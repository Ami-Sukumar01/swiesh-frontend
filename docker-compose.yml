version: "3.8"

services:
  frontend-dev:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
    command: npm run dev

  frontend-prod:
    build: .
    ports:
      - "3001:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    command: npm run start
